<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cough Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cough Test</h1>

        <p class="subtitle">
            Please upload a cough audio recording (5–10 seconds) in a quiet environment.
        </p>

        <p class="note">
            Accepted formats: .wav or .mp3
        </p>

        <input type="file" accept=".wav,.mp3">

        <br><br>

        <button class="btn" onclick="sendAudio()">
            Submit for Analysis
        </button>

        <br><br>

        <a href="index.html" class="link">
            Back to Home
        </a>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
