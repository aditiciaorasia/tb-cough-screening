<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cough Test</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>



    <div class="test-box">

        <!-- Back -->

        <a href="index.html"
            class="back-link">

            ← Back to Home

        </a>



        <!-- Heading -->

        <h1>Cough Screening</h1>



        <!-- Description -->

        <p>

            Upload a cough recording
            (5–10 seconds)
            in a quiet environment.

        </p>



        <!-- Steps -->

        <div class="screening-steps">

            <div class="step-item">

                1. Record cough clearly

            </div>

            <div class="step-item">

                2. Upload audio sample

            </div>

            <div class="step-item">

                3. AI analyzes pattern

            </div>

            <div class="step-item">

                4. Screening result generated

            </div>

        </div>



        <!-- Upload Box -->

        <label for="audioUpload"
            class="upload-box">

            Click to Upload Cough Audio

        </label>



        <!-- Hidden Input -->

        <input
            type="file"
            id="audioUpload"
            accept=".wav,.mp3">



        <!-- File Name -->

        <p id="fileName"
            class="file-name">

            No file selected

        </p>



        <!-- Analyze Button -->

        <button
            class="primary-btn"
            id="analyzeBtn"
            onclick="sendAudio()">

            Analyze Cough

        </button>



        <!-- Footer -->

        <p class="footer-note">

            This tool does not replace
            professional medical diagnosis.

        </p>

    </div>



    <script src="script.js"></script>

</body>

</html>
