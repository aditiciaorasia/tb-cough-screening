<!DOCTYPE html>
<html lang="en">
<head>

    <title>Cough Test</title>

<body>

    <div class="test-box">

    <a href="index.html" class="back-link">← Back to Home</a>

    <br><br>

    <button class="primary-btn" onclick="sendAudio()">
        Analyze Cough

        This tool does not replace professional medical diagnosis.
    </p>
